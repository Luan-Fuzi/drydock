name: release

# 推 v* tag（打在 main 的合并提交上）时构建签名正式包，挂到草稿 Release；
# 草稿由人工核对说明后再发布。Secrets 只在本 workflow 使用，fork 的 PR 读不到。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: 解码 keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "缺 RELEASE_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: 构建签名正式包
        env:
          DRYDOCK_KEYSTORE: ${{ runner.temp }}/release.jks
          DRYDOCK_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace

      - name: 校验签名与包形态
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          BADGING=$("$BT/aapt" dump badging "$APK")
          if grep -q "application-debuggable" <<<"$BADGING"; then echo "正式包不应 debuggable"; exit 1; fi
          grep -q "package: name='dev.drydock'" <<<"$BADGING" || { echo "包名不是 dev.drydock"; exit 1; }
          cp "$APK" "drydock-${GITHUB_REF_NAME}.apk"

      - name: 建草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "drydock-${GITHUB_REF_NAME}.apk" \
            --draft --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "签名正式包（dev.drydock）。发布前人工补充更新说明。"

      - name: 清理 keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
