name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    # arm64 runner：与本地/目标设备同架构（DSHA 已验证此形态可行）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v4：v3 会安装已停发的 SDK tools 包导致 sdkmanager 退出 1
      - uses: android-actions/setup-android@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: 断言 jniLibs 引擎产物
        run: |
          ls -la app/src/main/jniLibs/arm64-v8a/
          test -x app/src/main/jniLibs/arm64-v8a/libproot.so
          test -x app/src/main/jniLibs/arm64-v8a/libproot-loader.so

      - uses: actions/upload-artifact@v4
        with:
          name: drydock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
