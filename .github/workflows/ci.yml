name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    # x86_64：AGP 8.13 的 maven AAPT2 工件只有 x86_64 Linux 变体；
    # APK 组装与架构无关（arm64 引擎 .so 已入库）。将来 CI 需执行 arm64
    # 二进制（AV 冒烟/基准）时再单开 ubuntu-24.04-arm job。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v4：v3 会安装已停发的 SDK tools 包导致 sdkmanager 退出 1
      - uses: android-actions/setup-android@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      # i18n 批 2 起：翻译完整性门禁——values/ 与 values-zh/ 键集失配即红
      # （MissingTranslation / ExtraTranslation 双向，build.gradle.kts lint block）
      - name: Lint（翻译完整性门禁）
        run: ./gradlew :app:lintDebug --console=plain --stacktrace

      - name: 断言 jniLibs 引擎产物
        run: |
          ls -la app/src/main/jniLibs/arm64-v8a/
          test -x app/src/main/jniLibs/arm64-v8a/libproot.so
          test -x app/src/main/jniLibs/arm64-v8a/libproot-loader.so

      - uses: actions/upload-artifact@v4
        with:
          name: drydock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
